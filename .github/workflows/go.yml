name: Go

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Publish a GitHub release for an existing tag (e.g. v0.4).
          Leave empty to run tests only.
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: oldstable
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: |
          go test -v -tags=integration,e2e -race ./... -count=1 \
            -coverprofile=coverage.out \
            -coverpkg=github.com/lbe/go-exiftool-wasm,github.com/lbe/go-exiftool-wasm/internal/testutil

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || format('refs/tags/{0}', inputs.tag) }}

      - name: Generate changelog
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ]; then
            prev=$(git rev-list --max-parents=0 HEAD)
          fi
          if ! git log --oneline "${prev}..HEAD" > /tmp/changelog.txt; then
            echo "Initial release" > /tmp/changelog.txt
          fi
          if [ ! -s /tmp/changelog.txt ]; then
            echo "No commits since ${prev}." > /tmp/changelog.txt
          fi
          cat /tmp/changelog.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
